spring.application.name=corebancario

api.security.token.secret=${JWT_SECRET:corebank-local-development-secret-key-2026}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:2}

spring.datasource.url=jdbc:mysql://localhost:3306/corebancario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8082}
